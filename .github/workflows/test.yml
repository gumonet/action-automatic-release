name: Test Action
on:
  push:
    branches:
      - dev

jobs:
  test-action:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout del código
        uses: actions/checkout@v4

      - name: Ejecutar la Action
        uses: ./
        with:
          repo_token: "${{ secrets.G_TOKEN }}"
          automatic_release_tag: "prerelease"
          prerelease: true
          title: "Dev Version"